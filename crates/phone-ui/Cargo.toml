# SPDX-License-Identifier: GPL-3.0-only
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06), like neoui's apps.
[package]
name = "phone-ui"
description = "NeoPhone's screens in Slint (no_std): the Phone and Contacts pages, the call screens, settings"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
slint = { workspace = true }
# DEP_NEOUI_UI: neoui's theme, fonts and components (the @neoui library)
neoui-proto = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
png = { workspace = true }
