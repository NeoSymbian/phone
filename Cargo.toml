# SPDX-License-Identifier: Apache-2.0
# The host workspace of Phone, Contacts and Messages: the pure parts (contacts, phone-core: Apache-2.0) and each
# app's Slint UI (phone-ui, contacts-ui, messages-ui: GPL-3.0, they link Slint), tested on the host. The app EXEs are
# the separate symbian/ workspace (ARMv8, nightly build-std).
[workspace]
resolver = "3"
members = [
    "crates/contacts",
    "crates/phone-core",
    "crates/phone-ui",
    "crates/contacts-ui",
    "crates/messages-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
contacts = { path = "crates/contacts" }
phone-core = { path = "crates/phone-core" }
phone-ui = { path = "crates/phone-ui" }
contacts-ui = { path = "crates/contacts-ui" }
messages-ui = { path = "crates/messages-ui" }
# NeoSymbian/neohw (Apache-2.0): the NeoModem contract, dial rules, number matching, the blocklist
modem-ipc = { git = "https://github.com/NeoSymbian/neohw", rev = "7186c36b8d6b5d90bc983bcf5fb000ec16b492e4" }
phone-rules = { git = "https://github.com/NeoSymbian/neohw", rev = "7186c36b8d6b5d90bc983bcf5fb000ec16b492e4" }
sms = { git = "https://github.com/NeoSymbian/neohw", rev = "7186c36b8d6b5d90bc983bcf5fb000ec16b492e4" }
# NeoSymbian/neoui: the kit (the shared theme, fonts and components, as a build helper)
neoui-kit = { git = "https://github.com/NeoSymbian/neoui", rev = "616f0de8182518f3b00906e06bce9947dcb9a22c" }
# the same Slint as neoui (one copy in the ROM, no_std)
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
png = "=0.18.1"
