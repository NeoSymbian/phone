# SPDX-License-Identifier: Apache-2.0
# The host workspace of Phone, Contacts and Messages: the pure parts (contacts, phone-core: Apache-2.0) and each
# app's Slint UI (phone-ui, contacts-ui, messages-ui: GPL-3.0, they link Slint), tested on the host. The app EXEs are
# the separate symbian/ workspace (armv5te, nightly build-std).
[workspace]
resolver = "3"
members = [
    "crates/contacts",
    "crates/phone-core",
    "crates/phone-ui",
    "crates/contacts-ui",
    "crates/messages-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
contacts = { path = "crates/contacts" }
phone-core = { path = "crates/phone-core" }
phone-ui = { path = "crates/phone-ui" }
contacts-ui = { path = "crates/contacts-ui" }
messages-ui = { path = "crates/messages-ui" }
# NeoSymbian/telephony (Apache-2.0): the NeoModem contract, dial rules, number matching, the blocklist
modem-ipc = { git = "https://github.com/NeoSymbian/telephony", rev = "e18187a69f7b3c6cf60305430861a0c082ac8283" }
phone-rules = { git = "https://github.com/NeoSymbian/telephony", rev = "e18187a69f7b3c6cf60305430861a0c082ac8283" }
sms = { git = "https://github.com/NeoSymbian/telephony", rev = "e18187a69f7b3c6cf60305430861a0c082ac8283" }
# NeoSymbian/neoui: the kit (the shared theme, fonts and components, as a build helper)
neoui-kit = { git = "https://github.com/NeoSymbian/neoui", rev = "2f3f001d93e202c570949d5c6b075feb0af387c4" }
# the same Slint as neoui (one copy in the ROM, no_std)
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
png = "=0.18.1"
