# NEOPHONE.EXE, NEOCONT.EXE and NEOMSG.EXE (Phone, Contacts, Messages): built only for targets/armv8a-neosymbian-eabi.json with a
# pinned nightly (build-std), like neoui/symbian. GPL-3.0
# because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06). The pins must match neoui's: one e32 (it
# defines the global allocator) and one Slint in the ROM.
[workspace]
resolver = "3"
members = ["common", "phone", "contacts", "messages"]

[workspace.dependencies]
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "7d6ab96f8bc7a062f750dac3a0c9fe3e640cc359", features = ["critical-section"] }
neoui-proto = { git = "https://github.com/NeoSymbian/neoui", rev = "3274b8a4d641296b77d9ab3ce28143ce5a1e3375" }
neoapp = { git = "https://github.com/NeoSymbian/neoui", rev = "3274b8a4d641296b77d9ab3ce28143ce5a1e3375" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
modem-ipc = { git = "https://github.com/NeoSymbian/neohw", rev = "bbc39e2501e3051619765441746013bcacc29ff4" }
phone-rules = { git = "https://github.com/NeoSymbian/neohw", rev = "bbc39e2501e3051619765441746013bcacc29ff4" }
sms = { git = "https://github.com/NeoSymbian/neohw", rev = "bbc39e2501e3051619765441746013bcacc29ff4" }
contacts = { path = "../crates/contacts" }
phone-core = { path = "../crates/phone-core" }
phone-ui = { path = "../crates/phone-ui" }
contacts-ui = { path = "../crates/contacts-ui" }
messages-ui = { path = "../crates/messages-ui" }
phone-common = { path = "common" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
