# SPDX-License-Identifier: GPL-3.0-only
# NEOPHONE.EXE, NEOCONT.EXE and NEOMSG.EXE (Phone, Contacts, Messages): built only for targets/armv8a-neosymbian-eabi.json with a
# pinned nightly (build-std), like neoui/symbian. GPL-3.0
# because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06). The pins must match neoui's: one e32 (it
# defines the global allocator) and one Slint in the ROM.
[workspace]
resolver = "3"
members = ["common", "phone", "contacts", "messages"]

[workspace.dependencies]
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "8084b94f9e8264384113e7ea6fa52adf70944cc5", features = ["critical-section"] }
neoui-proto = { git = "https://github.com/NeoSymbian/neoui", rev = "b19d5978a01605c4766f86c54e648d21c5a9d10c" }
neoapp = { git = "https://github.com/NeoSymbian/neoui", rev = "b19d5978a01605c4766f86c54e648d21c5a9d10c" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
modem-ipc = { git = "https://github.com/NeoSymbian/neohw", rev = "f3a249a92fb03b76ea3ad2da42c3576e1307e20c" }
phone-rules = { git = "https://github.com/NeoSymbian/neohw", rev = "f3a249a92fb03b76ea3ad2da42c3576e1307e20c" }
sms = { git = "https://github.com/NeoSymbian/neohw", rev = "f3a249a92fb03b76ea3ad2da42c3576e1307e20c" }
contacts = { path = "../crates/contacts" }
phone-core = { path = "../crates/phone-core" }
phone-ui = { path = "../crates/phone-ui" }
contacts-ui = { path = "../crates/contacts-ui" }
messages-ui = { path = "../crates/messages-ui" }
phone-common = { path = "common" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
