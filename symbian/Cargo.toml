# SPDX-License-Identifier: GPL-3.0-only
# NEOPHONE.EXE, NEOCONT.EXE and NEOMSG.EXE (Phone, Contacts, Messages): built only for armv5te-none-eabi with a
# pinned nightly (build-std), like neoui/symbian. GPL-3.0
# because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06). The pins must match neoui's: one e32 (it
# defines the global allocator) and one Slint in the ROM.
[workspace]
resolver = "3"
members = ["common", "phone", "contacts", "messages"]

[workspace.dependencies]
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "e97e2ebcb242f5365d1b3f9d520646603e1e9056", features = ["critical-section"] }
neoui-proto = { git = "https://github.com/NeoSymbian/neoui", rev = "27a90f776d32e70cd8ecc231a499da348c4eb2e8" }
neoapp = { git = "https://github.com/NeoSymbian/neoui", rev = "27a90f776d32e70cd8ecc231a499da348c4eb2e8" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
modem-ipc = { git = "https://github.com/NeoSymbian/telephony", rev = "4095a4b7f34359fe8df25cd0e18e81c15be719c9" }
phone-rules = { git = "https://github.com/NeoSymbian/telephony", rev = "4095a4b7f34359fe8df25cd0e18e81c15be719c9" }
sms = { git = "https://github.com/NeoSymbian/telephony", rev = "4095a4b7f34359fe8df25cd0e18e81c15be719c9" }
contacts = { path = "../crates/contacts" }
phone-core = { path = "../crates/phone-core" }
phone-ui = { path = "../crates/phone-ui" }
contacts-ui = { path = "../crates/contacts-ui" }
messages-ui = { path = "../crates/messages-ui" }
phone-common = { path = "common" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
