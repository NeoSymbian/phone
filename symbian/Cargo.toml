# SPDX-License-Identifier: GPL-3.0-only
# NEOPHONE.EXE, NEOCONT.EXE and NEOMSG.EXE (Phone, Contacts, Messages): built only for armv5te-none-eabi with a
# pinned nightly (build-std), like neoui/symbian. GPL-3.0
# because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06). The pins must match neoui's: one e32 (it
# defines the global allocator) and one Slint in the ROM.
[workspace]
resolver = "3"
members = ["common", "phone", "contacts", "messages"]

[workspace.dependencies]
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "206b6c28cf49ef2f6e746580df97f05921500c35", features = ["critical-section"] }
neoui-proto = { git = "https://github.com/NeoSymbian/neoui", rev = "222c43f8116a6dba9ff170997ae7dc0feef055a0" }
neoapp = { git = "https://github.com/NeoSymbian/neoui", rev = "222c43f8116a6dba9ff170997ae7dc0feef055a0" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
modem-ipc = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
phone-rules = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
sms = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
contacts = { path = "../crates/contacts" }
phone-core = { path = "../crates/phone-core" }
phone-ui = { path = "../crates/phone-ui" }
contacts-ui = { path = "../crates/contacts-ui" }
messages-ui = { path = "../crates/messages-ui" }
phone-common = { path = "common" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
