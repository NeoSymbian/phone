# SPDX-License-Identifier: GPL-3.0-only
# NEOPHONE.EXE, NEOCONT.EXE and NEOMSG.EXE (Phone, Contacts, Messages): built only for targets/armv8a-neosymbian-eabi.json with a
# pinned nightly (build-std), like neoui/symbian. GPL-3.0
# because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06). The pins must match neoui's: one e32 (it
# defines the global allocator) and one Slint in the ROM.
[workspace]
resolver = "3"
members = ["common", "phone", "contacts", "messages"]

[workspace.dependencies]
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "41e0af1b9c0c741cc9619ebd749905661d2bab4f", features = ["critical-section"] }
neoui-proto = { git = "https://github.com/NeoSymbian/neoui", rev = "616f0de8182518f3b00906e06bce9947dcb9a22c" }
neoapp = { git = "https://github.com/NeoSymbian/neoui", rev = "616f0de8182518f3b00906e06bce9947dcb9a22c" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
modem-ipc = { git = "https://github.com/NeoSymbian/neohw", rev = "7186c36b8d6b5d90bc983bcf5fb000ec16b492e4" }
phone-rules = { git = "https://github.com/NeoSymbian/neohw", rev = "7186c36b8d6b5d90bc983bcf5fb000ec16b492e4" }
sms = { git = "https://github.com/NeoSymbian/neohw", rev = "7186c36b8d6b5d90bc983bcf5fb000ec16b492e4" }
contacts = { path = "../crates/contacts" }
phone-core = { path = "../crates/phone-core" }
phone-ui = { path = "../crates/phone-ui" }
contacts-ui = { path = "../crates/contacts-ui" }
messages-ui = { path = "../crates/messages-ui" }
phone-common = { path = "common" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
